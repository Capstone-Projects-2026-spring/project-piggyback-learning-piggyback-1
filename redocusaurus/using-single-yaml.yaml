openapi: 3.0.3
info:
  title: Piggyback Learning API
  version: 0.1.0
  description: >
    OpenAPI contract for Piggyback Learning FastAPI backend.

    Note: authentication is currently password-verification based and not
    uniformly enforced on all routes.
servers:
  - url: http://localhost:8000
    description: Local development server
tags:
  - name: auth
  - name: kids
  - name: expert
  - name: admin
  - name: media
x-websocket-contract:
  endpoint: /ws/questions/{video_id}
  clientPayload:
    start_seconds: integer
    interval_seconds: integer
    full_duration: boolean
  serverEvents:
    - status
    - segment_result
    - done
    - error
paths:
  /api/verify-password:
    post:
      tags:
        - auth
      summary: Verify admin/expert password
      operationId: verifyPassword
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - user_type
                - password
              properties:
                user_type:
                  type: string
                  enum:
                    - admin
                    - expert
                password:
                  type: string
      responses:
        '200':
          description: Verification result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyPasswordResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/expert-annotations:
    post:
      tags:
        - expert
      summary: Save expert annotations payload
      operationId: saveExpertAnnotations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Save result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericObject'
  /api/videos-list:
    get:
      tags:
        - expert
      summary: List downloaded videos
      operationId: listVideos
      responses:
        '200':
          description: Video list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideosListResponse'
  /api/expert-questions/{video_id}:
    get:
      tags:
        - expert
      summary: Get expert questions for a video
      operationId: getExpertQuestions
      parameters:
        - name: video_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Questions payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericObject'
        '404':
          description: Video/questions not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/expert-questions:
    post:
      tags:
        - expert
      summary: Save expert question payload
      operationId: saveExpertQuestion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Save result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericObject'
        '400':
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/save-final-questions:
    post:
      tags:
        - expert
      summary: Save final expert-approved questions
      operationId: saveFinalQuestions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Save result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericObject'
        '400':
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/tts:
    post:
      tags:
        - media
      summary: Generate TTS audio
      operationId: synthesizeTts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TTSRequest'
      responses:
        '200':
          description: TTS generation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TTSResponse'
        '400':
          description: Missing/invalid text
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Upstream TTS provider failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/expert/login:
    post:
      tags:
        - auth
      summary: Expert login
      operationId: expertLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Login result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericObject'
  /api/expert/logout:
    post:
      tags:
        - auth
      summary: Expert logout
      operationId: expertLogout
      responses:
        '200':
          description: Logout result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericObject'
  /api/learners/experts/{expert_id}/children:
    get:
      tags:
        - kids
      summary: Get children assigned to an expert
      operationId: getLearnersByExpert
      parameters:
        - name: expert_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Children list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericObject'
  /api/learners/children/{child_id}/report:
    get:
      tags:
        - kids
      summary: Get report for a child
      operationId: getChildReport
      parameters:
        - name: child_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Child report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericObject'
  /api/learners/children/{child_id}/videos:
    get:
      tags:
        - kids
      summary: Get videos for a child
      operationId: getChildVideos
      parameters:
        - name: child_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Videos list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericObject'
  /expert/edit/{video_id}:
    get:
      tags:
        - expert
      summary: Expert edit page for a video
      operationId: expertEditPage
      parameters:
        - name: video_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Expert edit view
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericObject'
  /api/expert/video/{video_id}/persona-variants:
    get:
      tags:
        - expert
      summary: Get persona variants for a video
      operationId: getPersonaVariants
      parameters:
        - name: video_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Persona variants
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericObject'
    post:
      tags:
        - expert
      summary: Generate persona variants for a video
      operationId: generatePersonaVariants
      parameters:
        - name: video_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Generated persona variants
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericObject'
  /api/expert/video/{video_id}/final-questions:
    get:
      tags:
        - expert
      summary: Get final questions for a video
      operationId: getExpertFinalQuestions
      parameters:
        - name: video_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Final questions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericObject'
  /api/expert/video/{video_id}/update-questions:
    post:
      tags:
        - expert
      summary: Update questions for a video
      operationId: updateExpertQuestions
      parameters:
        - name: video_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Update result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericObject'
  /api/expert/video/{video_id}/regenerate-question:
    post:
      tags:
        - expert
      summary: Regenerate a question for a video
      operationId: regenerateQuestion
      parameters:
        - name: video_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Regenerated question
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericObject'
  /api/expert/videos:
    get:
      tags:
        - expert
      summary: List all processed videos for experts
      operationId: listExpertVideos
      responses:
        '200':
          description: Video list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericObject'
  /api/expert/videos/{video_id}/claim:
    post:
      tags:
        - expert
      summary: Claim a video for review
      operationId: claimVideo
      parameters:
        - name: video_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Claim result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericObject'
  /api/expert/questions/persona-variants:
    post:
      tags:
        - expert
      summary: Generate persona variants for questions
      operationId: generateQuestionPersonaVariants
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Persona variants result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericObject'
components:
  securitySchemes:
    PasswordGate:
      type: apiKey
      in: header
      name: X-Role-Password
      description: >
        Documentation placeholder for current password-gated admin/expert flow.

        Current implementation uses POST /api/verify-password and does not
        enforce a uniform token/session policy.
  schemas:
    GenericObject:
      type: object
      additionalProperties: true
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        error:
          type: string
        detail:
          type: object
          additionalProperties: true
      additionalProperties: true
    VerifyPasswordResponse:
      type: object
      properties:
        success:
          type: boolean
        redirect:
          type: string
        message:
          type: string
      required:
        - success
    VideoListItem:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        thumbnail:
          type: string
        duration:
          type: number
        videoUrl:
          type: string
        questionCount:
          type: integer
    VideosListResponse:
      type: object
      properties:
        success:
          type: boolean
        videos:
          type: array
          items:
            $ref: '#/components/schemas/VideoListItem'
        message:
          type: string
      required:
        - success
        - videos
    TTSRequest:
      type: object
      properties:
        text:
          type: string
        voice:
          type: string
          default: sage
        speed:
          type: number
          default: 0.75
        format:
          type: string
          default: mp3
      required:
        - text
    TTSResponse:
      type: object
      properties:
        success:
          type: boolean
        audio:
          type: string
          description: Base64-encoded audio bytes
        format:
          type: string
        voice:
          type: string
        message:
          type: string
      required:
        - success
    FrameExtractionResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        files:
          type: array
          items:
            type: string
        video_id:
          type: string
        output_dir:
          type: string
        count:
          type: integer
    AdminVideoItem:
      type: object
      properties:
        video_id:
          type: string
        title:
          type: string
        duration_seconds:
          type: number
        duration_formatted:
          type: string
        has_frames:
          type: boolean
        frame_count:
          type: integer
        has_questions:
          type: boolean
        frames_dir:
          type: string
        question_file:
          type: string
    AdminVideosResponse:
      type: object
      properties:
        success:
          type: boolean
        count:
          type: integer
        videos:
          type: array
          items:
            $ref: '#/components/schemas/AdminVideoItem'
        message:
          type: string
      required:
        - success
        - count
        - videos
    SubmitQuestionsRequest:
      type: object
      required:
        - video_id
        - questions
      properties:
        video_id:
          type: string
        questions:
          type: array
          items:
            type: object
            additionalProperties: true
    SubmitQuestionsResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        file_url:
          type: string
        file_path:
          type: string
      required:
        - success
        - message
    KidsVideoItem:
      type: object
      properties:
        video_id:
          type: string
        title:
          type: string
        duration:
          type: string
        local_path:
          type: string
        thumbnail:
          type: string
    KidsVideosResponse:
      type: object
      properties:
        success:
          type: boolean
        count:
          type: integer
        videos:
          type: array
          items:
            $ref: '#/components/schemas/KidsVideoItem'
      required:
        - success
        - count
        - videos
    FinalQuestionSegment:
      type: object
      properties:
        segment_range_start:
          type: integer
        segment_range_end:
          type: integer
        question:
          type: string
        answer:
          type: string
        llm_ranking:
          type: integer
        expert_ranking:
          type: integer
    FinalQuestionsResponse:
      type: object
      properties:
        success:
          type: boolean
        segments:
          type: array
          items:
            $ref: '#/components/schemas/FinalQuestionSegment'
        error:
          type: string
      required:
        - success
    CheckAnswerRequest:
      type: object
      required:
        - expected
        - user
      properties:
        expected:
          type: string
        user:
          type: string
        question:
          type: string
    CheckAnswerResponse:
      type: object
      properties:
        similarity:
          type: number
        expected:
          type: string
        user:
          type: string
        is_numeric:
          type: boolean
        status:
          type: string
          enum:
            - correct
            - almost
            - wrong
        reason:
          type: string
      required:
        - similarity
        - expected
        - user
        - status
    TranscribeResponse:
      type: object
      properties:
        success:
          type: boolean
        text:
          type: string
        error:
          type: string
      required:
        - success
    ConfigResponse:
      type: object
      properties:
        skip_prevention:
          type: boolean
        thresholds:
          type: object
          additionalProperties: true
      required:
        - skip_prevention
        - thresholds
    ValidationError:
      type: object
      properties:
        loc:
          type: array
          items:
            oneOf:
              - type: string
              - type: integer
        msg:
          type: string
        type:
          type: string
      required:
        - loc
        - msg
        - type
    HTTPValidationError:
      type: object
      properties:
        detail:
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
